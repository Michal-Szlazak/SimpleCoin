<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SimpleCoin Wallet</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            color: #333;
            margin: 40px;
        }

        h1 {
            color: #007bff;
        }

        .actions {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f7ff;
        }

        .small-text {
            font-size: 0.9em;
            color: #555;
            word-break: break-all;
        }

        .address {
            font-weight: 600;
            color: #222;
        }

        /* Button styling */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Align button under the table */
        .table-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<h1>SimpleCoin Wallet</h1>

<!-- Connection Status & Connect Form -->
<div style="
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
">

    <!-- Connection Status -->
    <div th:style="'background-color:' + (${connected} ? '#28a745' : '#f44336') + ';' +
                     'color:white;padding:8px 12px;border-radius:8px;font-weight:600;font-size:0.9em;text-align:center;min-width:150px;'">
        <span th:text="${connected} ? 'Connected to node' : 'Disconnected from node'"></span>
    </div>

    <!-- Connect Form -->
    <form th:action="@{/wallet/node/connect}" method="post" style="display: flex; gap: 6px;">
        <label>
            <input type="text" name="host" placeholder="Host:Port"
                   style="padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9em;" required>
        </label>
        <button type="submit" class="btn" style="padding: 6px 10px; font-size: 0.9em;">Connect</button>
    </form>
</div>


<h2>Your Identities</h2>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Public Key</th>
        <th>Encrypted Private Key</th>
        <th>Salt</th>
        <th>IV</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="identity : ${identities}">
        <td class="small-text" th:text="${identity.name}"></td>
        <td class="address" th:text="${identity.address}"></td>
        <td class="small-text" th:text="${identity.publicKey}"></td>
        <td class="small-text" th:text="${identity.encryptedPrivateKey}"></td>
        <td class="small-text" th:text="${identity.salt}"></td>
        <td class="small-text" th:text="${identity.iv}"></td>
    </tr>
    </tbody>
</table>

<!-- UTXOs -->
<div class="section">
    <h2>Unspent Transaction Outputs (UTXOs)</h2>

    <table id="utxo-table">
        <thead>
        <tr>
            <th>Transaction ID</th>
            <th>Address</th>
            <th>Value</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${utxos}">
            <td th:text="${entry.key}"></td>
            <td th:text="${entry.value.address}"></td>
            <td th:text="${#numbers.formatDecimal(entry.value.value, 1, 8)}"></td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    async function refreshUtxos() {
        const response = await fetch('/wallet/utxos');
        const data = await response.json();

        const tableBody = document.querySelector('#utxo-table tbody');
        tableBody.innerHTML = ''; // clear old rows

        for (const [txid, output] of Object.entries(data)) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${txid}</td>
                <td>${output.address}</td>
                <td>${output.value.toFixed(8)}</td>
            `;
            tableBody.appendChild(row);
        }
    }

    // Optional: auto-refresh every 15s
    setInterval(refreshUtxos, 15000);
</script>

</body>
</html>
