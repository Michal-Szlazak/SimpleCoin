services:
  node1:
    image: my-p2p-node:latest
    build:
      context: ./Node
    container_name: node1
    environment:
      - SPRING_APPLICATION_NAME=Node1
      - NODE_ID=node1
      - PORT=8080
      - STATIC_NODES=node2,node2:8081
      - PEER_LIMIT=3
    ports:
      - "8080:8080"

  node2:
    image: my-p2p-node:latest
    build:
      context: ./Node
    container_name: node2
    environment:
      - SPRING_APPLICATION_NAME=Node2
      - NODE_ID=node2
      - PORT=8081
      - STATIC_NODES=node3,node3:8082
      - PEER_LIMIT=3
    ports:
      - "8081:8081"

  node3:
    image: my-p2p-node:latest
    build:
      context: ./Node
    container_name: node3
    environment:
      - SPRING_APPLICATION_NAME=Node3
      - NODE_ID=node3
      - PORT=8082
      - STATIC_NODES=node1,node1:8080
      - PEER_LIMIT=3
    ports:
      - "8082:8082"
